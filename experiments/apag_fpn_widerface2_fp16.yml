
DEVICE: "GPU"

MODEL:
  MODEL_NAME: "apag_fpn_net2"
  BACKBONE: 'resnet_18'
  INPUT_SIZE: [256, 384] # [H, W], each must be a positive multiple of 32.
  # Output target H/W is derived from INPUT_SIZE / 4.
  PRETRAINED: true
  EXPORTABLE: false
  ALIGN_CORNERS: true
  OUTPUT_FORMAT: 'heatmap_offset_wh2_widerface'
  PATH_SAVE: '/home/j/models/face_detection/apag-fpn2-fp16-qat-wider-original-0000'


DATASET:
  NAME: "wider_face_original2"
  ROOT_TRAIN: "/home/j/database/widerface_original"
  ROOT_VALID: "/home/j/database/widerface_original"
  NUM_CLASS: 1

AUGMENTATION:
  SRC_FACE_MIN: 24         # Original face max(w,h) required for center selection.
  MIN_FACE_RATIO: 0.07     # Final face max(w,h) <= min(input H,W)*ratio: background.
  BACKGROUND_PROB: 0.2
  FILL_VALUE: 128          # Erasing is only used in background branches.
  TRANSLATION_MARGIN_RATIO: 0.1
  TRANSLATION_MIN_MARGIN: 5
  TRANSLATION_MAX_MARGIN_RATIO: 0.45
  FOREGROUND:
    MIN_FACE_SIZE: 10      # Sampling bound; independent of MIN_FACE_RATIO filtering.
    SCALE_RANGE: [0.5, 2.0] # Target face size relative to selected original face.
    SCALE_MIN_GAP: 10
    ROTATION_DEGREES: 10
    ROTATION_PROB: 0.5
    FLIP_PROB: 0.5
    CROP_SCALE_RANGE: [0.2, 1.0] # No-candidate background fallback.
  BACKGROUND:
    SCALE_RANGE: [0.5, 2.0] # Target crop size relative to max(input H,W).
    ROTATION_DEGREES: 30
    FLIP_PROB: 0.5
    CROP_SCALE_RANGE: [0.2, 0.95]
  PIXEL_NOISE: 0.4         # Per-channel multiplicative noise strength.
  GAMMA: 0.3              # Gamma shift range; must be <1.
  BLUR_PROB: 0.1
  BLUR_KERNEL_RANGE: [3, 11] # Random integer kernel, rounded up to odd.


OPTIMIZER:
  OPT_NAME: "adam"
  LR: 0.001
  USE_LR_MULT: false
  LR_MULT_TARGET: [ "xxxxx", "xxx" ]
  LR_MULT_VAL: [ 1.0, 1.0 ]

  LR_SCHEDULER:
    SCHEDULER_NAME: multisteplr
    milestones: [ 100, 160 ]
    gamma: 0.1


TRAIN:
  SEED_NUMBER: 1024
  CUDNN_DETER: true
  CUDNN_BENCH: false

  WORKERS: 4
  BATCH_SIZE: 32
  SHUFFLE: true

  FREEZE: false
#  PREWEIGHT_INFO:
#    USE_CKPT: true
#    LOCAL_CKPT: '/home/j/models_cla/apag-imgn/086.pt'

  PREWEIGHT_INFO:
    USE_CKPT: true
    LOCAL_CKPT: '/home/j/models/face_detection/apag-fpn2-0000/180.pt'

  BEGIN_EPOCH: 0
  END_EPOCH: 200
  RESUME: false
  RESUME_PATH: '/'

  MAX_STEP: -1
  PRINT_FREQ: 40

VALID:
  WORKERS: 1
  BATCH_SIZE: 1
  SHUFFLE: false
  SCORE_THRESHOLD: 0.4
  IOU_THRESHOLD: 0.4
  NMS_IOU_THRESHOLD: 0.4
  EVAL_IOU_THRESHOLD: 0.5
  AP_SCORE_THRESHOLD: 0.001
  GT_DIR: '/home/j/projects/FaceDetection/dataset/widerface_eval_gt' 

# FP32 master weights + FP16 rounding simulation; no AMP.
QAT:
  ENABLED: true
  DTYPE: float16


# Independent FDDB validation; excluded from training and model selection.
FDDB:
  ENABLED: true
  ROOT: '/home/j/database/FDDB copy'
  BATCH_SIZE: 1
  WORKERS: 1
  INTERVAL: 1
  EVALUATOR: '/home/j/projects/FaceDetection/tools/fddb_evaluation/evaluate'
